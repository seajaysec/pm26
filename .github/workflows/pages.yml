name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must already be enabled with "GitHub Actions" as the source
      # (Settings -> Pages -> Build and deployment -> Source). The workflow's
      # GITHUB_TOKEN can deploy to an existing Pages site but cannot create
      # one, so `enablement: true` fails with "Resource not accessible by
      # integration" on a repo where Pages has never been turned on.
      - name: Check Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "::error::GitHub Pages is not enabled for this repository. Enable it at https://github.com/${{ github.repository }}/settings/pages by setting Source to 'GitHub Actions', then re-run this workflow."
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
